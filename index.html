<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مؤسسة المصطفى للأدوات الكهربائية والحدايد</title>
<meta name="theme-color" content="#0F2438">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI","Noto Kufi Arabic",Tahoma,sans-serif;
    background:#F4F6F8;color:#0F2438;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:22px;
  }
  .card{
    background:#fff;border:1px solid #E1E7EC;border-radius:18px;
    padding:34px 26px;max-width:440px;width:100%;text-align:center;
    box-shadow:0 12px 40px rgba(15,36,56,.10);
  }
  .mark{
    width:62px;height:62px;margin:0 auto 16px;border-radius:16px;background:#F2A93B;
    display:flex;align-items:center;justify-content:center;font-size:31px;
  }
  h1{font-size:19px;line-height:1.6;margin-bottom:20px}
  .ok{
    background:#EAF6F0;border:1px solid #BFE0CF;color:#1F6647;
    border-radius:12px;padding:14px 16px;font-size:15px;font-weight:700;
    line-height:1.9;margin-bottom:16px;
  }
  .note{
    background:#FFF7EA;border:1px solid #F5DFB8;border-radius:12px;
    padding:14px 16px;color:#6B5427;font-size:14px;line-height:2;text-align:right;
  }
  .foot{margin-top:18px;color:#8A97A3;font-size:12.5px;line-height:1.9}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">⚡</div>
    <h1>مؤسسة المصطفى<br>للأدوات الكهربائية والحدايد</h1>
    <div class="ok">✅ العنوان شغال</div>
    <div class="note">
      الصفحة دي بتأكد بس إن الموقع وصلك.<br>
      البرنامج نفسه هيتحط هنا بعد ما نخلّص ربط الدرايف.
    </div>
    <p class="foot">لحد ساعتها، البرنامج شغال عادي على كمبيوتر المحل.</p>
  </div>
</body>
</html>
